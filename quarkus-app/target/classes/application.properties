# H2 in-memory configuration
quarkus.datasource.db-kind=h2
quarkus.datasource.jdbc.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
quarkus.datasource.username=sa
quarkus.datasource.password=

# Schema generation for dev/test; change in prod to validate or use migrations
quarkus.hibernate-orm.database.generation=drop-and-create

# Expose metrics and OpenAPI
quarkus.micrometer.export.prometheus.enabled=true
quarkus.micrometer.export.prometheus.path=/metrics
quarkus.swagger-ui.always-include=true
quarkus.smallrye-openapi.path=/openapi

# Application name
quarkus.application.name=demo-quarkus
