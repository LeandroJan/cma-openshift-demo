apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: demoapp-scaledobject
  namespace: cma
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: cma-openshift-demo
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 30
  cooldownPeriod: 300
  triggers:
    - type: prometheus
      metadata:
        serverAddress: https://thanos-querier.openshift-monitoring.svc.cluster.local:9091
        metricName: http_server_requests_seconds_count
        threshold: "50"
        query: |
          sum(
            rate(
              http_server_requests_seconds_count{
                application="demo-app"
              }[1m]
            )
          )
        authModes: "bearer"
        unsafeSsl: "true"
      authenticationRef:
        name: cma-prom-trigger-auth
