apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: springboot-demo-scaler
  namespace: demo-keda
spec:
  scaleTargetRef:
    name: springboot-demo
  minReplicaCount: 1
  maxReplicaCount: 10
  pollingInterval: 15
  cooldownPeriod: 30
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://thanos-querier.openshift-monitoring.svc:9090
        metricName: http_requests_total
        query: |
          sum(rate(http_requests_total[1m])) by (application)
        threshold: "1000"
